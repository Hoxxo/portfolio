<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/website_icon2.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiroshi Angelo Fernandez — Portfolio</title>
    <meta
      name="description"
      content="Hiroshi Angelo Fernandez — Computer Science graduate researcher specializing in digital communications and error-correcting codes."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
